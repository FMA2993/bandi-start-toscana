name: update

# Aggiorna i dati ogni mattina e li committa: chi clona fa solo `git pull`.
# Gli allegati (85 MB di binari) NON finiscono nel repo: vengono caricati
# come artifact della run (scaricabili per 30 giorni).

on:
  schedule:
    - cron: "15 6 * * *" # 06:15 UTC = 07:15 CET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Installa dipendenze
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Test (offline, sulle fixture)
        run: .venv/bin/python -m pytest -q

      - name: Scrape bandi + allegati
        run: make update

      - name: Commit dei dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "nessuna novità oggi"
          else
            git commit -m "data: aggiornamento $(date -u +%F)"
            git push
          fi

      - name: Upload allegati
        uses: actions/upload-artifact@v4
        with:
          name: allegati
          path: allegati
          retention-days: 30
          if-no-files-found: warn
