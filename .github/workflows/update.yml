name: update

# Aggiorna i dati ogni mattina e li committa: chi ha clonato fa solo `git pull`.
#
# Qui girano SOLO i dati (JSON, CSV, report HTML): ~1 MB e pochi minuti.
# Gli allegati (85 MB di binari, dal portale toscano a un runner in US = lento)
# si scaricano a mano con `make update`, oppure lanciando questo workflow
# manualmente con "scarica allegati" = true.

on:
  schedule:
    - cron: "15 6 * * *" # 06:15 UTC = 07:15 CET
  workflow_dispatch:
    inputs:
      allegati:
        description: "Scarica anche i PDF degli allegati (lento)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Installa dipendenze
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Test (offline, sulle fixture)
        run: .venv/bin/python -m pytest -q

      - name: Scrape bandi
        run: |
          if [ "${{ inputs.allegati }}" = "true" ]; then
            make update
          else
            make update-data
          fi

      - name: Commit dei dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "nessuna novità oggi"
          else
            git commit -m "data: aggiornamento $(date -u +%F)"
            git push
          fi

      - name: Upload allegati (solo su richiesta)
        if: ${{ inputs.allegati == true }}
        uses: actions/upload-artifact@v4
        with:
          name: allegati
          path: allegati
          retention-days: 30
          if-no-files-found: warn
