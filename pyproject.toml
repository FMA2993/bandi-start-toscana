[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bandi-start-toscana"
version = "1.0.0"
description = "Estrattore dei bandi di gara aperti dal portale START Toscana (sanità): metadati, lotti, CIG, allegati"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bandi-toscana = "start_toscana:main"

[tool.setuptools]
py-modules = ["start_toscana"]

[tool.pytest.ini_options]
testpaths = ["tests"]
